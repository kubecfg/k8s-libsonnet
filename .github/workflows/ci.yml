name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: |
          sudo curl -fsSL -o /usr/local/bin/kubecfg https://github.com/kubecfg/kubecfg/releases/download/v0.39.0/kubecfg_Linux_X64
          sudo chmod +x /usr/local/bin/kubecfg
      - run: just test
